        let preguntasActuales = [];
        let indiceActual = 0;
        let puntaje = 0;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function iniciarExamen() {
            // Reiniciar estado
            puntaje = 0;
            indiceActual = 0;
            document.getElementById('score-display').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            
            // Mezclar todas las preguntas y sus opciones
            preguntasActuales = shuffleArray(bancoPreguntas).map(p => ({
                ...p,
                opciones: shuffleArray(p.opciones)
            }));
            
            actualizarProgreso();
            renderizarPregunta();
        }

        function actualizarProgreso() {
            const porcentaje = ((indiceActual) / preguntasActuales.length) * 100;
            document.getElementById('progress-bar').style.width = `${porcentaje}%`;
            document.getElementById('progress-text').innerText = `Pregunta ${indiceActual + 1} de ${preguntasActuales.length}`;
        }

        function renderizarPregunta() {
            const container = document.getElementById('quiz-container');
            const p = preguntasActuales[indiceActual];
            
            let html = `
                <div class="question-block active">
                    <div class="question-title">${indiceActual + 1}. ${p.pregunta}</div>
            `;
            
            p.opciones.forEach((opcion, i) => {
                html += `<button class="option-btn" onclick="verificarRespuesta(${i}, ${opcion.correcta}, this)">${opcion.texto}</button>`;
            });

            html += `
                    <div class="explanation" id="exp-${indiceActual}">
                        <strong>💡 Justificación:</strong> ${p.explicacion}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            document.getElementById('btn-next').disabled = true;
        }

        function verificarRespuesta(indexOpcion, esCorrecta, btn) {
            const botones = document.querySelectorAll('.option-btn');
            botones.forEach(b => b.disabled = true);
            
            const opcionesActuales = preguntasActuales[indiceActual].opciones;
            
            botones.forEach((b, i) => {
                if (opcionesActuales[i].correcta) {
                    b.classList.add('correct');
                }
            });

            if (!esCorrecta) {
                btn.classList.add('incorrect');
            } else {
                puntaje++;
            }

            document.getElementById(`exp-${indiceActual}`).style.display = 'block';
            
            const btnNext = document.getElementById('btn-next');
            btnNext.disabled = false;
            
            if (indiceActual === preguntasActuales.length - 1) {
                btnNext.innerText = "Finalizar Examen";
            } else {
                btnNext.innerText = "Siguiente Pregunta";
            }
        }

        function siguientePregunta() {
            if (indiceActual < preguntasActuales.length - 1) {
                indiceActual++;
                actualizarProgreso();
                renderizarPregunta();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            document.getElementById('progress-bar').style.width = `100%`;
            document.getElementById('progress-text').innerText = `Examen Finalizado`;
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('btn-next').disabled = true;
            
            const scoreDisplay = document.getElementById('score-display');
            const porcentaje = Math.round((puntaje / preguntasActuales.length) * 100);
            
            let mensaje = "";
            if(porcentaje >= 90) mensaje = "¡Excelente dominio del tema!";
            else if(porcentaje >= 70) mensaje = "Buen trabajo, estás listo para el examen.";
            else mensaje = "Te recomiendo repasar los conceptos de Gobernanza y Arquitectura.";
            
            document.getElementById('quiz-container').insertAdjacentHTML('afterend', `
                <div class="score-display" id="score-display" style="display: block;">
                    Tu calificación: ${puntaje} / ${preguntasActuales.length} (${porcentaje}%)<br>
                    <span style="font-size: 0.6em; color: #6c757d;">${mensaje}</span>
                </div>
            `);
        }

        // Iniciar la primera vez que carga la página
        window.onload = iniciarExamen;
    </script>
